function updateWaktu() {
    const s = new Date();

    const elJam = document.getElementById('jamSekarang');
    if (elTgl) elTgl.textContent = tgl;
    if (elJam) elJam.textContent = jam + ' WIB';
}

function prosesLogin(event) {
    event.preventDefault();
    const u = document.getElementById('usernameLogin').value.trim();

    const notif = document.getElementById('notifikasiLogin');
    
    if (!u || !p) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Username dan Password wajib diisi!';
        notif.classList.remove('d-none');
        return false;
    }
    if (u === SUPERADMIN_USERNAME && p === SUPERADMIN_PASSWORD) {
        userAktif = { nama: 'SuperAdmin', role: 'SuperAdmin', kodeRole: 'SA', idUser: 'ID_TK2R_SA-0001' };
        notif.className = 'alert alert-success';
        notif.innerHTML = 'Login SuperAdmin berhasil!';
        notif.classList.remove('d-none');
        setTimeout(masukDasbor, 500);
        return false;
    }
    notif.className = 'alert alert-danger';
    notif.innerHTML = 'Username atau Password salah!';
    notif.classList.remove('d-none');
    return false;
}

function masukDasbor() {
    const konten = document.getElementById('kontenDasbor');
    if (konten && kontenAsliDasbor) konten.innerHTML = kontenAsliDasbor;

    document.getElementById('offcanvasRoleUser').textContent = userAktif.role;
    loadMenuNavigasi(userAktif.kodeRole);
    tampilkanHalaman('dasbor');
    document.getElementById('usernameLogin').value = '';
    document.getElementById('passwordLogin').value = '';
    document.getElementById('notifikasiLogin').classList.add('d-none');
    updateWaktu();
}

function prosesLogout() {
    const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
    if (offcanvas) offcanvas.hide();
    userAktif = null;
    tampilkanHalaman('login');

function loadMenuNavigasi(kodeRole) {
    const config = menuConfig[kodeRole] || menuConfig['CT'];
    const menuContainer = document.getElementById('menuNavigasi');
    let htmlMenu = '';

    for (let i = 0; i < config.menu.length; i++) {
        const item = config.menu[i];
        if (item.aksi === 'buatAkun') {
            htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="tampilkanFormBuatAkun()"><i class="' + item.ikon + ' me-2" style="color: #FF8C00;"></i>' + item.nama + '</a>';
        } else if (item.aksi === 'persetujuanAkun') {
            htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="tampilkanPersetujuanAkun()"><i class="' + item.ikon + ' me-2" style="color: #FF8C00;"></i>' + item.nama + '</a>';
        } else if (item.aksi === 'kelolaAkun') {
            htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="tampilkanKelolaAkun()"><i class="' + item.ikon + ' me-2" style="color: #FF8C00;"></i>' + item.nama + '</a>';
        } else {
            htmlMenu += '<a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="tampilkanPlaceholderMenu(\'' + item.nama + '\', \'' + item.blok + '\')"><i class="' + item.ikon + ' me-2" style="color: #FF8C00;"></i>' + item.nama + '</a>';
        }
    }

    htmlMenu += '<hr class="border-secondary"><a href="#" class="list-group-item list-group-item-action bg-dark text-white border-secondary menu-item" onclick="prosesLogout()"><i class="fas fa-sign-out-alt me-2 text-danger"></i>Logout</a>';
    menuContainer.innerHTML = htmlMenu;
}

    else { pw.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
}

function generateIDBuat(kodeRole) {
    const format = { ADM: 'ID_TK2R_ADM', SOT: 'ID_TK2R_SOT', SOO: 'ID_TK2R_SOO', MKT: 'ID_TK2R_MKT', TGH: 'ID_TK2R_TGH', CS: 'ID_TK2R_CS', CT: 'ID_TK2R_CUST', TK: 'ID_TK2R_TK', OJ: 'ID_TK2R_OJ', PP: 'ID_TK2R_PS', PM: 'ID_TK2R_PM', COD: 'ID_TK2R_CS' };
    const input = document.getElementById('idOtomatisBuat');
    if (!input) return '';
    if (!format[kodeRole]) { input.value = ''; return ''; }
    const id = format[kodeRole] + '-' + Math.floor(Math.random() * 9000 + 1000);
    input.value = id;
    return id;
}

function cekRoleBuatAkun() {
    const role = document.getElementById('roleAkunBuat').value;
    const bagianNIK = document.getElementById('bagianNIKBuat');
    const nikInput = document.getElementById('nikKtpBuat');
    const info = document.getElementById('infoRoleBuat');
    const nikRoles = ['SOT', 'SOO', 'TK', 'OJ', 'PP', 'PM', 'COD'];
    if (nikRoles.includes(role)) {
        bagianNIK.style.display = 'block';
        nikInput.setAttribute('required', '');
    } else {
        bagianNIK.style.display = 'none';
        nikInput.removeAttribute('required');
    }
    info.innerHTML = '<i class="fas fa-check-circle me-1" style="color:#4CAF50;"></i> Akun ' + role + ' - Langsung AKTIF';
    generateIDBuat(role);
    cekTombolBuatAktif();
}

function ambilKoordinatBuat() {
    const status = document.getElementById('statusKoordinatBuat');
    const tombol = document.getElementById('tombolAmbilKoordinatBuat');
    if (!navigator.geolocation) { status.innerHTML = 'Geolokasi tidak didukung'; return; }
    status.innerHTML = 'Mengambil lokasi...';
    tombol.disabled = true;
    navigator.geolocation.getCurrentPosition(function(pos) {
        document.getElementById('latitudeBuat').value = pos.coords.latitude;
        document.getElementById('longitudeBuat').value = pos.coords.longitude;
        document.getElementById('textLatitudeBuat').textContent = pos.coords.latitude;
        document.getElementById('textLongitudeBuat').textContent = pos.coords.longitude;
        status.innerHTML = 'Lokasi berhasil!'; status.style.color = 'green';
        document.getElementById('koordinatTextBuat').classList.remove('d-none');
        tombol.disabled = false;
        cekTombolBuatAktif();
    }, function() {
        status.innerHTML = 'Gagal mengambil lokasi'; status.style.color = 'red';
        tombol.disabled = false;
    });
}

function cekTombolBuatAktif() {
    const lat = document.getElementById('latitudeBuat').value;
    const lng = document.getElementById('longitudeBuat').value;
    const role = document.getElementById('roleAkunBuat').value;
    const id = document.getElementById('idOtomatisBuat').value;
    const btn = document.getElementById('tombolBuatAkun');
    if (btn) btn.disabled = !(lat && lng && role && id);
}

function prosesBuatAkun(event) {
    event.preventDefault();
    const notif = document.getElementById('notifikasiBuatAkun');
    const pass = document.getElementById('passwordBuat').value;
    const konf = document.getElementById('konfirmasiPasswordBuat').value;
    const nama = document.getElementById('namaLengkapBuat').value;
    const user = document.getElementById('usernameBuat').value;
    const id = document.getElementById('idOtomatisBuat').value;
    if (pass !== konf) {
        notif.className = 'alert alert-warning';
        notif.innerHTML = 'Password tidak cocok!';
        notif.classList.remove('d-none');
        return false;
    }
    notif.className = 'alert alert-success';
    notif.innerHTML = '<strong>Akun berhasil dibuat!</strong><br>Nama: ' + nama + '<br>ID: ' + id + '<br>Username: ' + user + '<br>Status: AKTIF';
    notif.classList.remove('d-none');
    document.getElementById('formBuatAkun').reset();
    document.getElementById('idOtomatisBuat').value = '';
    document.getElementById('tombolBuatAkun').disabled = true;
    document.getElementById('koordinatTextBuat').classList.add('d-none');
    return false;
}

function tampilkanPersetujuanAkun() {
    const konten = document.getElementById('kontenDasbor');
    if (!kontenAsliDasbor) kontenAsliDasbor = konten.innerHTML;
    const container = document.getElementById('halamanPersetujuanAkunContainer');
    if (container) {
        konten.innerHTML = container.innerHTML;
        muatTabelPending();
    }
    const offcanvas = bootstrap.Offcanvas.getInstance(document.getElementById('offcanvasMenu'));
    if (offcanvas) offcanvas.hide();
}

function muatTabelPending() {
    const tbody = document.getElementById('tabelPending');
    const tidakAda = document.getElementById('tidakAdaPending');
    if (!tbody) return;
    
    if (dataPending.length === 0) {
        tbody.innerHTML = '';
        tidakAda.classList.remove('d-none');
        return;
    }
    tidakAda.classList.add('d-none');
    
    let rows = '';
    for (let i = 0; i < dataPending.length; i++) {
        const item = dataPending[i];
        rows += '<tr id="row-' + i + '">' +
            '<td><span class="fw-bold">' + item.id + '</span></td>' +
            '<td>' + item.nama + '</td>' +
            '<td>' + item.role + '</td>' +
            '<td>' + item.username + '</td>' +
            '<td>' + item.tgl + '</td>' +
            '<td>' +
            '<button class="btn btn-sm btn-success me-1" onclick="setujuiAkun(' + i + ')"><i class="fas fa-check"></i> Setujui</button>' +
            '<button class="btn btn-sm btn-danger" onclick="tolakAkun(' + i + ')"><i class="fas fa-times"></i> Tolak</button>' +
            '</td>' +
            '</tr>';
    }
    tbody.innerHTML = rows;
}

function setujuiAkun(index) {
    const notif = document.getElementById('notifikasiPersetujuan');
    const item = dataPending[index];
    if (!item) return;
    dataPending.splice(index, 1);
    notif.className = 'alert alert-success';
    notif.innerHTML = '<i class="fas fa-check-circle me-2"></i>Akun <strong>' + item.nama + '</strong> (' + item.id + ') telah <strong>DISETUJUI</strong> dan sekarang AKTIF.';
    notif.classList.remove('d-none');
    muatTabelPending();
    setTimeout(() => { notif.classList.add('d-none'); }, 4000);
}

function tolakAkun(index) {
    const notif = document.getElementById('notifikasiPersetujuan');
    const item = dataPending[index];
    if (!item) return;
    if (!confirm('Apakah Anda yakin menolak akun ' + item.nama + ' (' + item.id + ')?')) return;
    dataPending.splice(index, 1);
    notif.className = 'alert alert-warning';
    notif.innerHTML = '<i class="fas fa-times-circle me-2"></i>Akun <strong>' + item.nama + '</strong> (' + item.id + ') telah <strong>DITOLAK</strong>.';
    notif.classList.remove('d-none');
    muatTabelPending();
    setTimeout(() => { notif.classList.add('d-none'); }, 4000);
}

    tidakAda.classList.add('d-none');

    let rows = '';
    for (let i = 0; i < dataAkunAktif.length; i++) {
        const item = dataAkunAktif[i];
        rows += '<tr id="rowaktif-' + i + '">' +
            '<td><span class="fw-bold">' + item.id + '</span></td>' +
            '<td>' + item.nama + '</td>' +
            '<td>' + item.role + '</td>' +
            '<td>' + item.username + '</td>' +
            '<td><span class="badge bg-success">' + item.status + '</span></td>' +
            '<td>' +
            '<button class="btn btn-sm btn-warning me-1" onclick="blokirAkun(' + i + ')"><i class="fas fa-lock"></i> Blokir</button>' +
            '<button class="btn btn-sm btn-danger" onclick="hapusAkun(' + i + ')"><i class="fas fa-trash"></i> Hapus</button>' +
            '</td>' +
            '</tr>';
    }
    tbody.innerHTML = rows;
}

function blokirAkun(index) {
    const notif = document.getElementById('notifikasiKelolaAkun');
    const item = dataAkunAktif[index];
    if (!item) return;
    if (!confirm('Blokir akun ' + item.nama + ' (' + item.id + ')?')) return;
    item.status = 'Diblokir';
    notif.className = 'alert alert-warning';
    notif.innerHTML = '<i class="fas fa-exclamation-triangle me-2"></i>Akun <strong>' + item.nama + '</strong> (' + item.id + ') telah <strong>DIBLOKIR</strong>.';
    notif.classList.remove('d-none');
    muatTabelAkunAktif();
    setTimeout(() => { notif.classList.add('d-none'); }, 4000);
}

function hapusAkun(index) {
    const notif = document.getElementById('notifikasiKelolaAkun');
    const item = dataAkunAktif[index];
    if (!item) return;
    if (!confirm('Hapus permanen akun ' + item.nama + ' (' + item.id + ')?')) return;
    dataAkunAktif.splice(index, 1);
    notif.className = 'alert alert-danger';
    notif.innerHTML = '<i class="fas fa-trash-alt me-2"></i>Akun <strong>' + item.nama + '</strong> (' + item.id + ') telah <strong>DIHAPUS</strong>.';
    notif.classList.remove('d-none');
    muatTabelAkunAktif();
    setTimeout(() => { notif.classList.add('d-none'); }, 4000);
}
