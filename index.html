<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toko Online 2R - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #FF8C00, #FF6B00, #FF5500);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.95);
            width: 100%;
            max-width: 400px;
        }
    </style>
</head>
<body>

<div class="card shadow-lg border-0">
    <div class="card-body p-4">
        
        <div class="text-center mb-4">
            <div class="bg-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px; box-shadow: 0 5px 15px rgba(0,0,0,0.2);">
                <i class="fas fa-store-alt fa-3x" style="color: #FF8C00;"></i>
            </div>
            <h3 class="fw-bold">Toko Online 2R</h3>
            <p class="text-muted">Silakan login ke akun Anda</p>
        </div>
        
        <form method="GET" action="dasbor.html">
            <div class="mb-3">
                <label class="form-label fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text text-white" style="background-color: #FF8C00;"><i class="fas fa-user"></i></span>
                    <input type="text" name="username" class="form-control" placeholder="Masukkan username" required>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text text-white" style="background-color: #FF8C00;"><i class="fas fa-lock"></i></span>
                    <input type="password" name="password" class="form-control" placeholder="Masukkan password" required>
                </div>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-lg fw-bold text-white" style="background-color: #FF8C00;">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                </button>
            </div>
        </form>
        
        <hr>
        
        <div class="d-grid gap-2">
            <a href="daftar.html" class="btn btn-outline-secondary" style="border-color: #FF8C00; color: #FF8C00;">
                <i class="fas fa-user-plus me-1"></i>Daftar Akun Baru
            </a>
            <a href="daftar.html" class="btn btn-outline-secondary" style="border-color: #FF6B00; color: #FF6B00;">
                <i class="fas fa-paper-plane me-1"></i>Ajukan Daftar ke Admin
            </a>
            <a href="lupa.html" class="btn btn-link text-muted">
                <i class="fas fa-question-circle me-1"></i>Lupa Password?
            </a>
        </div>
        
    </div>
</div>

</body>
</html>
