<!-- ===== BLOK 1.1 - TAG HTML & META ===== -->
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Multi Role - Toko Online 2R</title>
<!-- ===== AKHIR BLOK 1.1 ===== -->
<!-- ===== BLOK 1.2 - LINK FONTAWESOME & GOOGLE FONTS ===== -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- ===== AKHIR BLOK 1.2 ===== -->
<!-- ===== BLOK 1.3 - FAVICON (IKON TAB BROWSER) ===== -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<!-- ===== AKHIR BLOK 1.3 ===== -->
<!-- ===== BLOK 1.4 - PENUTUP HEAD & PEMBUKA BODY ===== -->
</head>
<body>
<!-- ===== AKHIR BLOK 1.4 ===== -->

<!-- ===== BLOK 1.5 - WADAH NOTIFIKASI TOAST ===== -->
<div id="toastContainer"></div>
<!-- ===== AKHIR BLOK 1.5 ===== -->
<!-- ===== BLOK 2.1 - WRAPPER & KOTAK LOGIN ===== -->
<div id="pageAuthentication">
    <div class="authentication-wrapper">
        <div class="authentication-box">
            
            <!-- KONTEN AKAN DIISI DI BLOK 2.2 - 2.7 -->
            
        </div>
    </div>
</div>
<!-- ===== AKHIR BLOK 2.1 ===== -->
<!-- ===== BLOK 2.2 - LOGO & JUDUL APLIKASI ===== -->
<div class="authentication-logo">
    <i class="fas fa-store-alt"></i>
    <h1>Toko Online <span style="color:#FF6B00;">2R</span></h1>
    <p>Platform Belanja & Layanan Serba Ada</p>
</div>
<!-- ===== AKHIR BLOK 2.2 ===== -->
<!-- ===== BLOK 2.3 - AREA PESAN ERROR ===== -->
<div class="authentication-error" id="authenticationError">
    <i class="fas fa-exclamation-circle"></i> 
    <span id="authenticationErrorText"></span>
</div>
<!-- ===== AKHIR BLOK 2.3 ===== -->
<!-- ===== BLOK 2.4 - FORM LOGIN ===== -->
<form class="authentication-form" id="loginForm" autocomplete="off">
    <div class="form-group">
        <label>Username</label>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="loginUsername" placeholder="Masukkan username" required>
        </div>
    </div>
    <div class="form-group">
        <label>Password</label>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="loginPassword" placeholder="Masukkan password" required>
        </div>
    </div>
    <button type="submit" class="button-submit">
        <i class="fas fa-sign-in-alt"></i> Login
    </button>
</form>
<!-- ===== AKHIR BLOK 2.4 ===== -->
<!-- ===== BLOK 2.5 - FORM REGISTER (REVISI) ===== -->
<form class="authentication-form hidden-form" id="registerForm">
    <div class="form-group">
        <label>Pilih Role</label>
        <div class="input-group">
            <i class="fas fa-user-tag"></i>
            <select id="registerRole">
                <option value="customer">Customer</option>
                <option value="toko">Toko</option>
                <option value="ojek">Ojek</option>
                <option value="pedagang">Pedagang Pasar</option>
                <option value="codseller">COD Seller</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label>ID Akun (Otomatis)</label>
        <div class="input-group">
            <i class="fas fa-id-card"></i>
            <input type="text" id="registerIdPreview" class="form-input" value="Akan dibuat otomatis" disabled style="background-color:#f0f0f0; color:#666666;">
        </div>
    </div>
    <div class="form-group">
        <label>Username</label>
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="registerUsername" placeholder="Buat username" required>
        </div>
    </div>
    <div class="form-group">
        <label>Password</label>
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="registerPassword" placeholder="Buat password" required>
        </div>
    </div>
    <div class="form-group">
        <label>Nama Lengkap</label>
        <div class="input-group">
            <i class="fas fa-id-card"></i>
            <input type="text" id="registerNama" placeholder="Nama lengkap Anda" required>
        </div>
    </div>

    <!-- ===== TAMBAHAN LOKASI ===== -->
    <div class="grid-2">
        <div class="form-group">
            <label>Alamat / Lokasi</label>
            <div class="input-group">
                <i class="fas fa-map-pin"></i>
                <input type="text" id="registerLokasi" class="form-input" placeholder="Ketik alamat atau klik tombol Ambil Lokasi">
            </div>
        </div>
        <div class="form-group" style="display:flex; align-items:flex-end;">
            <button type="button" class="button button-primary button-small" onclick="ambilLokasiRegister()" style="width:100%;">
                <i class="fas fa-location-dot"></i> Ambil Lokasi Otomatis
            </button>
        </div>
    </div>
    <input type="hidden" id="registerLat" value="">
    <input type="hidden" id="registerLng" value="">
    <!-- ============================= -->

    <!-- TOMBOL DAFTAR DENGAN ID DAN DISABLED -->
    <button type="submit" class="button-submit" id="btnDaftar" disabled>
        <i class="fas fa-user-plus"></i> Daftar
    </button>
    <div class="authentication-footer">
        Sudah punya akun? 
        <a onclick="toggleForm('login')">Login di sini</a>
    </div>
</form>
<!-- ===== AKHIR BLOK 2.5 ===== -->
<!-- ===== BLOK 2.6 - FORM PENGAJUAN BUKA AKUN (REVISI) ===== -->
<form class="authentication-form hidden-form" id="pengajuanBukaAkunForm">
    <div class="form-group">
        <label>Nama Lengkap</label>
        <div class="input-group"><i class="fas fa-user"></i><input type="text" id="pengajuanNama" placeholder="Nama lengkap" required></div>
    </div>
    <div class="form-group">
        <label>Email / Nomor HP</label>
        <div class="input-group"><i class="fas fa-envelope"></i><input type="text" id="pengajuanKontak" placeholder="Email atau HP" required></div>
    </div>
    <div class="form-group">
        <label>Role yang Diinginkan</label>
        <div class="input-group"><i class="fas fa-user-tag"></i>
            <select id="pengajuanRole">
                <option value="toko">Toko</option>
                <option value="pedagang">Pedagang Pasar</option>
                <option value="codseller">COD Seller</option>
            </select>
        </div>
    </div>
    <div class="form-group">
        <label>Alasan Pembuatan Akun</label>
        <div class="input-group"><i class="fas fa-comment"></i><input type="text" id="pengajuanAlasan" placeholder="Misal: Ingin berjualan online" required></div>
    </div>

    <!-- ===== TAMBAHAN LOKASI ===== -->
    <div class="grid-2">
        <div class="form-group">
            <label>Alamat / Lokasi</label>
            <div class="input-group">
                <i class="fas fa-map-pin"></i>
                <input type="text" id="pengajuanLokasi" class="form-input" placeholder="Ketik alamat">
            </div>
        </div>
        <div class="form-group" style="display:flex; align-items:flex-end;">
            <button type="button" class="button button-primary button-small" onclick="ambilLokasiPengajuan()" style="width:100%;">
                <i class="fas fa-location-dot"></i> Ambil Lokasi Otomatis
            </button>
        </div>
    </div>
    <input type="hidden" id="pengajuanLat" value="">
    <input type="hidden" id="pengajuanLng" value="">
    <!-- ============================= -->

    <!-- TOMBOL AJUKAN DENGAN ID DAN DISABLED -->
    <button type="submit" class="button-submit" id="btnAjukan" disabled>
        <i class="fas fa-paper-plane"></i> Ajukan ke Admin
    </button>
    <div class="authentication-footer">
        Sudah punya akun? <a onclick="toggleForm('login')">Login di sini</a>
    </div>
</form>
<!-- ===== AKHIR BLOK 2.6 ===== -->
<!-- ===== BLOK 2.7 - FOOTER & NAVIGASI FORM ===== -->
<div class="authentication-footer">
    Belum punya akun? 
    <a href="javascript:void(0)" onclick="toggleForm('register')" style="cursor:pointer;">Daftar di sini</a>
    <br>
    <a href="javascript:void(0)" onclick="toggleForm('pengajuan')" style="cursor:pointer;">Ajukan buka akun</a>
</div>
<!-- ===== AKHIR BLOK 2.7 ===== -->
<!-- ===== BLOK 3.1 - NAVBAR UTAMA (JAM & PROFIL) ===== -->
<div id="pageDashboard" class="page-dashboard">
    <nav class="navbar">
        <div class="navbar-brand">
            <button id="menuToggle"><i class="fas fa-bars"></i></button>
            <i class="fas fa-store-alt"></i> Toko Online 2R
        </div>
        <div class="navbar-user">
            <!-- Jam & Tanggal -->
            <div class="navbar-time" style="display:flex; flex-direction:column; align-items:flex-end; margin-right:15px; font-size:12px; color:#555;">
                <span id="displayJam" style="font-weight:600; font-size:14px;">00:00:00</span>
                <span id="displayTanggal" style="font-size:11px;">Senin, 01 Januari 2026</span>
            </div>

            <!-- Avatar Foto Profil -->
            <img id="userAvatar" src="" style="display:none; width:32px; height:32px; border-radius:50%; object-fit:cover; margin-right:8px; vertical-align:middle; border:2px solid var(--primary);">
            <span id="userAvatarPlaceholder" style="display:inline-block; width:32px; height:32px; border-radius:50%; background:#eee; text-align:center; line-height:32px; color:#aaa; margin-right:8px; vertical-align:middle;">
                <i class="fas fa-user"></i>
            </span>

            <span class="role-badge" id="roleBadge">Role</span>
            <span id="userNama" style="font-weight:600;">User</span>
            <button class="button-logout" id="buttonLogout"><i class="fas fa-sign-out-alt"></i> Keluar</button>
        </div>
    </nav>
<!-- ===== AKHIR BLOK 3.1 ===== -->
<!-- ===== BLOK 3.2 - SIDEBAR CONTAINER & OVERLAY ===== -->
<aside class="sidebar" id="sidebarContainer"></aside>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<!-- ===== AKHIR BLOK 3.2 ===== -->
<!-- ===== BLOK 3.3 - AREA KONTEN UTAMA (MAIN CONTENT) ===== -->
<main class="content" id="mainContent"></main>
<!-- ===== AKHIR BLOK 3.3 ===== -->

<!-- ===== BLOK 4 - CSS GLOBAL & UTILITY ===== -->
<style>
    /* ====================================================== */
    /* BLOK 4.1 – CSS RESET GLOBAL                            */
    /* ====================================================== */

    /* -------- VARIABEL WARNA & UKURAN -------- */
    :root {
        --primary: #FF6B00;
        --primary-dark: #e65c00;
        --primary-light: #fff5f0;
        --bg: #f8f9fa;
        --text: #333333;
        --text-muted: #888888;
        --border: #e9ecef;
        --shadow: 0 4px 20px rgba(0,0,0,0.08);
        --radius: 12px;
    }

    /* ===== BLOK 4.1.1 – RESET DASAR ===== */
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
        font-family:'Poppins', sans-serif; 
        background:var(--bg); 
        min-height:100vh; 
        color:var(--text); 
        line-height:1.6; 
    }

    /* ===== BLOK 4.1.2 – KELAS TAMPILAN HALAMAN ===== */
    .page-dashboard { display:none; }
    .page-content { display:none; }
    .page-content.active { display:block; }
    .hidden { display:none !important; }
    .hidden-form { display:none !important; }
    .margin-top-10 { margin-top:10px; }

    /* ===== BLOK 4.1.3 – TOAST NOTIFICATION ===== */
    #toastContainer { 
        position:fixed; 
        top:20px; 
        right:20px; 
        z-index:99999; 
        display:flex; 
        flex-direction:column; 
        gap:10px; 
        max-width:400px; 
        width:90%; 
    }
    .toast { 
        padding:14px 20px; 
        border-radius:var(--radius); 
        color:white; 
        font-size:14px; 
        font-weight:500; 
        box-shadow:var(--shadow); 
        animation:slideInRight 0.4s ease; 
        display:flex; 
        align-items:center; 
        gap:12px; 
        backdrop-filter:blur(4px); 
    }
    .toast.success { background:#4CAF50; }
    .toast.error { background:#F44336; }
    .toast.warning { background:#FF9800; }
    .toast.info { background:#2196F3; }
    @keyframes slideInRight { 
        from { transform:translateX(100%); opacity:0; } 
        to { transform:translateX(0); opacity:1; } 
    }

    /* ===== BLOK 4.1.4 – EMPTY STATE ===== */
    .empty-state { 
        text-align:center; 
        padding:40px 20px; 
        color:var(--text-muted); 
        background:white; 
        border-radius:var(--radius); 
        box-shadow:var(--shadow); 
        border:1px solid var(--border); 
    }
    .empty-state i { font-size:48px; color:#ddd; display:block; margin-bottom:12px; }
    .empty-state h3 { font-size:18px; font-weight:600; margin:10px 0 5px; }

    /* ===== BLOK 4.1.5 – HALAMAN LOGIN/REGISTER ===== */
    #pageAuthentication { 
        display:flex; 
        justify-content:center; 
        align-items:center; 
        min-height:100vh; 
        background:linear-gradient(135deg, var(--primary-light), #ffe0cc); 
    }

    /* ===== BLOK 4.1.6 – ANIMASI NOTIFIKASI ===== */
    @keyframes fadeInOut { 
        0% { opacity:0; transform:translateY(-20px); } 
        20% { opacity:1; transform:translateY(0); } 
        80% { opacity:1; transform:translateY(0); } 
        100% { opacity:0; transform:translateY(-20px); } 
    }
</style>
<!-- ===== AKHIR BLOK 4 ===== -->
</body>
</html>
