<script>
    // ===== BLOK 7.1 - DATA & HASH =====
    function getDataAkun() {
        var dataAkun = localStorage.getItem('2r_akun');
        return dataAkun ? JSON.parse(dataAkun) : [];
    }
    function simpanDataAkun(akun) {
        localStorage.setItem('2r_akun', JSON.stringify(akun));
    }

    async function hashPassword(password) {
        var encoder = new TextEncoder();
        var data = encoder.encode(password);
        var hashBuffer = await crypto.subtle.digest('SHA-256', data);
        var hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');
    }

    function generateId(role) {
        var dataAkun = getDataAkun();
        var daftar = [];
        for (var i = 0; i < dataAkun.length; i++) {
            if (dataAkun[i].role === role) daftar.push(dataAkun[i]);
        }
        var nomorUrut = 1;
        for (var j = 0; j < daftar.length; j++) {
            var bagian = daftar[j].id.split('-');
            if (bagian.length === 2) {
                var nomor = parseInt(bagian[1]);
                if (nomor >= nomorUrut) nomorUrut = nomor + 1;
            }
        }
        var prefix = '';
        if (role === 'customer') prefix = 'CUST';
        else if (role === 'toko') prefix = 'TOKO';
        else if (role === 'ojek') prefix = 'OJEK';
        else if (role === 'pedagang') prefix = 'PEDAGANG';
        else if (role === 'codseller') prefix = 'COD';
        else prefix = 'USR';
        return prefix + '-' + String(nomorUrut).padStart(3, '0');
    }
    // ===== AKHIR BLOK 7.1 =====

    // ===== BLOK 7.3 - TOAST =====
    function tampilkanToast(pesan, tipe) {
        if (!tipe) tipe = 'success';
        var container = document.getElementById('toastContainer');
        var toast = document.createElement('div');
        toast.className = 'toast ' + tipe;
        var ikon = '';
        if (tipe === 'success') ikon = 'fa-check-circle';
        else if (tipe === 'error') ikon = 'fa-times-circle';
        else if (tipe === 'warning') ikon = 'fa-exclamation-triangle';
        else ikon = 'fa-info-circle';
        toast.innerHTML = '<i class="fas ' + ikon + '"></i> ' + pesan;
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.animation = 'slideInRight 0.3s ease reverse';
            setTimeout(function() { toast.remove(); }, 300);
        }, 3500);
    }
    // ===== AKHIR BLOK 7.3 =====

    // ===== BLOK 8.26.1 - TOGGLE FORM =====
    function toggleForm(tipe) {
        var login = document.getElementById('loginForm');
        var register = document.getElementById('registerForm');
        var pengajuan = document.getElementById('pengajuanBukaAkunForm');

        if (login) login.classList.add('hidden-form');
        if (register) register.classList.add('hidden-form');
        if (pengajuan) pengajuan.classList.add('hidden-form');

        if (tipe === 'register') {
            if (register) register.classList.remove('hidden-form');
        } else if (tipe === 'pengajuan') {
            if (pengajuan) pengajuan.classList.remove('hidden-form');
        } else {
            if (login) login.classList.remove('hidden-form');
        }
    }
    // ===== AKHIR BLOK 8.26.1 =====

    // ===== BLOK 8.56 - AMBIL LOKASI OTOMATIS =====
    function ambilLokasiRegister() {
        if (!navigator.geolocation) {
            tampilkanToast('Browser tidak mendukung geolokasi.', 'error');
            return;
        }
        tampilkanToast('Mengambil lokasi...', 'info');
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            document.getElementById('registerLat').value = lat;
            document.getElementById('registerLng').value = lng;

            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng, {
                headers: { 'User-Agent': 'TokoOnline2R-App/1.0' }
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                document.getElementById('registerLokasi').value = data.display_name || 'Lokasi tidak diketahui';
                tampilkanToast('Lokasi berhasil diambil!', 'success');
                document.getElementById('btnDaftar').removeAttribute('disabled');
            })
            .catch(function() {
                document.getElementById('registerLokasi').value = 'Lat: ' + lat + ', Lng: ' + lng;
                tampilkanToast('Lokasi berhasil (tanpa alamat detail).', 'info');
                document.getElementById('btnDaftar').removeAttribute('disabled');
            });
        }, function(err) {
            tampilkanToast('Gagal mengambil lokasi: ' + err.message, 'error');
        });
    }

    function ambilLokasiPengajuan() {
        if (!navigator.geolocation) {
            tampilkanToast('Browser tidak mendukung geolokasi.', 'error');
            return;
        }
        tampilkanToast('Mengambil lokasi...', 'info');
        navigator.geolocation.getCurrentPosition(function(pos) {
            var lat = pos.coords.latitude;
            var lng = pos.coords.longitude;
            document.getElementById('pengajuanLat').value = lat;
            document.getElementById('pengajuanLng').value = lng;

            fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat=' + lat + '&lon=' + lng, {
                headers: { 'User-Agent': 'TokoOnline2R-App/1.0' }
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                document.getElementById('pengajuanLokasi').value = data.display_name || 'Lokasi tidak diketahui';
                tampilkanToast('Lokasi berhasil diambil!', 'success');
                document.getElementById('btnAjukan').removeAttribute('disabled');
            })
            .catch(function() {
                document.getElementById('pengajuanLokasi').value = 'Lat: ' + lat + ', Lng: ' + lng;
                tampilkanToast('Lokasi berhasil (tanpa alamat detail).', 'info');
                document.getElementById('btnAjukan').removeAttribute('disabled');
            });
        }, function(err) {
            tampilkanToast('Gagal mengambil lokasi: ' + err.message, 'error');
        });
    }
    // ===== AKHIR BLOK 8.56 =====

    // ===== BLOK 8.2.3 - REGISTER SUBMIT (DAFTAR) =====
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        var role = document.getElementById('registerRole').value;
        var username = document.getElementById('registerUsername').value.trim();
        var password = document.getElementById('registerPassword').value.trim();
        var nama = document.getElementById('registerNama').value.trim();
        var lat = document.getElementById('registerLat').value.trim();
        var lng = document.getElementById('registerLng').value.trim();

        // Validasi Lokasi
        if (lat === '' || lng === '') {
            tampilkanToast('Anda WAJIB mengambil lokasi otomatis terlebih dahulu!', 'error');
            return;
        }

        if (!role || !username || !password || !nama) {
            tampilkanToast('Data belum lengkap!', 'warning');
            return;
        }
        if (username.length < 4) { tampilkanToast('Username minimal 4 karakter!', 'warning'); return; }
        if (password.length < 6) { tampilkanToast('Password minimal 6 karakter!', 'warning'); return; }

        var dataAkun = getDataAkun();
        for (var i = 0; i < dataAkun.length; i++) {
            if (dataAkun[i].username === username) {
                tampilkanToast('Username sudah digunakan!', 'error');
                return;
            }
        }

        var status = (role === 'toko' || role === 'ojek') ? 'NONAKTIF (Menunggu Verifikasi)' : 'AKTIF';
        var hash = await hashPassword(password);
        var akunBaru = {
            id: generateId(role),
            role: role,
            username: username,
            password: hash,
            nama: nama,
            email: '',
            nomorHp: '',
            alamat: '',
            latitude: lat,
            longitude: lng,
            namaBank: '',
            nomorRekening: '',
            pemilikRekening: '',
            status: status,
            waktuRegistrasi: new Date().toISOString()
        };
        dataAkun.push(akunBaru);
        simpanDataAkun(dataAkun);
        tampilkanToast('Akun berhasil dibuat! ID: ' + akunBaru.id + '\nStatus: ' + status, 'success');
        
        document.getElementById('registerForm').reset();
        document.getElementById('btnDaftar').setAttribute('disabled', 'disabled');
        toggleForm('login');
    });
    // ===== AKHIR BLOK 8.2.3 =====
        // ===== BLOK 8.2.4 - LUPA PASSWORD =====
    // Fungsi ini dipanggil saat user mengklik "Lupa Password?"
    async function lupaPassword() {
        var username = document.getElementById('loginUsername').value.trim();
        if (!username) {
            tampilkanToast('Masukkan username Anda terlebih dahulu!', 'warning');
            return;
        }

        // 🔒 Pencegahan khusus: SuperAdmin tidak bisa di-reset passwordnya lewat sini
        if (username === 'admin') {
            tampilkanToast('Akun SuperAdmin tidak dapat di-reset melalui form ini!', 'error');
            return;
        }

        var dataAkun = getDataAkun();
        var user = null;
        var indexUser = -1;
        for (var i = 0; i < dataAkun.length; i++) {
            if (dataAkun[i].username === username) {
                user = dataAkun[i];
                indexUser = i;
                break;
            }
        }

        if (!user) {
            tampilkanToast('Username tidak ditemukan!', 'error');
            return;
        }

        // Generate password baru (8 karakter acak)
        var newPassword = Math.random().toString(36).slice(-8);
        var hash = await hashPassword(newPassword);
        
        // Update password di database
        dataAkun[indexUser].password = hash;
        simpanDataAkun(dataAkun);

        tampilkanToast('Password berhasil di-reset! Password baru Anda: ' + newPassword, 'success');
    }
    // ===== AKHIR BLOK 8.2.4 =====

    // ===== BLOK 8.26.2 - PENGAJUAN SUBMIT (AJUKAN KE ADMIN) =====
    document.getElementById('pengajuanBukaAkunForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        var nama = document.getElementById('pengajuanNama').value.trim();
        var kontak = document.getElementById('pengajuanKontak').value.trim();
        var role = document.getElementById('pengajuanRole').value;
        var alasan = document.getElementById('pengajuanAlasan').value.trim();
        var lat = document.getElementById('pengajuanLat').value.trim();
        var lng = document.getElementById('pengajuanLng').value.trim();

        // Validasi Lokasi
        if (lat === '' || lng === '') {
            tampilkanToast('Anda WAJIB mengambil lokasi otomatis terlebih dahulu!', 'error');
            return;
        }

        if (!nama || !kontak || !role || !alasan) {
            tampilkanToast('Semua data wajib diisi!', 'warning');
            return;
        }

        var dataPengajuan = JSON.parse(localStorage.getItem('2r_pengajuan_buka_akun') || '[]');
        dataPengajuan.push({
            id: 'PB-' + Date.now(),
            nama: nama,
            kontak: kontak,
            role: role,
            alasan: alasan,
            latitude: lat,
            longitude: lng,
            alamatLokasi: document.getElementById('pengajuanLokasi').value.trim() || '',
            status: 'MENUNGGU',
            waktu: new Date().toISOString()
        });
        localStorage.setItem('2r_pengajuan_buka_akun', JSON.stringify(dataPengajuan));

        document.getElementById('pengajuanBukaAkunForm').reset();
        document.getElementById('btnAjukan').setAttribute('disabled', 'disabled');
        tampilkanToast('Pengajuan Anda telah dikirim ke Staf Admin!', 'success');
        toggleForm('login');
    });
    // ===== AKHIR BLOK 8.26.2 =====
</script>
